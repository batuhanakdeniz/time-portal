spring.application.name=time-portal
# life-planner 8080'i kullandığı için ikisi aynı anda çalışabilsin diye 8081
server.port=${PORT:8081}

# Üretici: city-image (gerçek: ilçe görseli + ONNX derinlik) | fake (örnek yapıtlar)
timeportal.generator=city-image
timeportal.artifacts-dir=./data/artifacts
timeportal.depth.model-dir=${user.home}/.cache/time-portal/models
# Derinlik griye çevrilirken ölçek (#66): panoramada alt şerit (yükseklik oranı) istatistikten hariç,
# yüzdelik kırpma (low-pct..high-pct) ve gamma (<1 orta tonları açar). Fotoğrafta exclude-bottom uygulanmaz.
timeportal.depth.normalize.exclude-bottom=0.15
timeportal.depth.normalize.low-pct=1
timeportal.depth.normalize.high-pct=99
timeportal.depth.normalize.gamma=0.7
